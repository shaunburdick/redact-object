# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      # One failing Node line should not cancel the others.
      fail-fast: false
      matrix:
        # Lint runs once, on 24.x, because its result does not depend on the runtime;
        # the tests run on every version because they do.
        include:
          - node-version: 20.x
            script: test:unit
          - node-version: 22.x
            script: test:unit
          - node-version: 24.x
            script: test
          - node-version: 26.x
            script: test:unit

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci
    - run: npm run ${{ matrix.script }}

  package:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'

    - run: npm ci
    - run: npm run build
    - run: npm run lint:pkg
    - run: npm run smoke:pack
