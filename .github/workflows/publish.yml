---
    name: Publish

    on:
        push:
            branches: ["main"]

    jobs:
        test:
            name: Test Package
            runs-on: ubuntu-latest
            strategy:
                # One failing Node line should not cancel the others.
                fail-fast: false
                matrix:
                    # eslint-plugin-unicorn (via eslint-config-shaunburdick) needs Node >= 20.10,
                    # so the 20.9.0 floor cell runs the build and tests without lint.
                    include:
                        - node-version: 20.9.0
                          script: test:unit
                        - node-version: 20.x
                          script: test
                        - node-version: 22.x
                          script: test
                        - node-version: 24.x
                          script: test
                        - node-version: 26.x
                          script: test

            steps:
                - uses: actions/checkout@v4
                - name: Use Node.js ${{ matrix.node-version }}
                  uses: actions/setup-node@v4
                  with:
                      node-version: ${{ matrix.node-version }}
                - run: npm ci
                - run: npm run ${{ matrix.script }}

        package:
            name: Check Package
            runs-on: ubuntu-latest

            steps:
                - uses: actions/checkout@v4
                - name: Use Node.js
                  uses: actions/setup-node@v4
                  with:
                      node-version: 24.x
                - run: npm ci
                - run: npm run build
                - run: npm run lint:pkg
                - run: npm run smoke:pack

        publish:
            name: Publish Library
            needs: [test, package]
            if: github.event_name == 'push' && github.ref_name == 'main'  # This condition limits the job to pushes to the main branch
            runs-on: ubuntu-latest
            permissions:
                id-token: write  # Required for OIDC
                contents: read   # Required to checkout the repo

            steps:
                - uses: actions/checkout@v5
                - uses: actions/setup-node@v5
                  with:
                    node-version: 22
                    registry-url: 'https://registry.npmjs.org'
                - name: Update npm
                  run: npm install -g npm@latest
                - run: npm ci
                - run: npm run build
                - name: Get package version
                  id: package-version
                  run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
                - name: Check if version exists on NPM
                  id: version-check
                  run: |
                    if npm view redact-object@${{ steps.package-version.outputs.version }} version 2>/dev/null; then
                      echo "exists=true" >> $GITHUB_OUTPUT
                    else
                      echo "exists=false" >> $GITHUB_OUTPUT
                    fi
                - name: Publish to NPM
                  if: steps.version-check.outputs.exists == 'false'
                  run: |
                    if [[ "${{ steps.package-version.outputs.version }}" == *"beta"* ]]; then
                      npm publish --tag beta --provenance --access public
                    else
                      npm publish --provenance --access public
                    fi
                - name: Publish status
                  if: steps.version-check.outputs.exists == 'false'
                  run: |
                    echo "Published version ${{ steps.package-version.outputs.version }} to NPM"
